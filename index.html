<!DOCTYPE html>
<html>

<head>
    <title>Лілка: DIY-консоль для ентузіастів</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico" />

    <style type="text/css">
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .background {
            background: url('./static/lilka_v21.jpg') no-repeat center center;
            background-size: cover;
            height: 100%;
            width: 100%;
            font-family: "Roboto", sans-serif;
        }

        .content {
            background-color: rgba(0, 0, 0, 0.9);
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
        }

        .soon {
            text-align: center;
            margin-bottom: 4em;
        }

        .title {
            font-size: 5em;
            font-weight: 300;
        }

        .title .glow {
            animation: glow 2s infinite;
            animation-timing-function: linear;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 20px hsl(0, 100%, 50%);
                color: hsl(0, 100%, 90%);
            }

            33% {
                text-shadow: 0 0 20px hsl(120, 100%, 50%);
                color: hsl(120, 100%, 90%);
            }

            66% {
                text-shadow: 0 0 20px hsl(240, 100%, 50%);
                color: hsl(240, 100%, 90%);
            }

            100% {
                text-shadow: 0 0 20px hsl(360, 100%, 50%);
                color: hsl(360, 100%, 90%);
            }
        }

        .sub {
            font-size: 3em;
            text-shadow: 0 0 10px rgba(0, 0, 0, 1);
        }

        .badges {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            gap: 1em;
            margin-bottom: 1rem;
        }

        .badge {
            display: block;
            text-decoration: none;
            display: block;
            background-color: #444444;
            color: #FFFFFF;
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .badge .left,
        .badge .right {
            padding: 0.5em;
            font-size: 1em;
            text-transform: uppercase;
        }

        .badge .left {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .badge .left .icon {
            width: 1.5em;
            height: 1.5em;
            padding-right: 0.5em;
            color: white;
            display: flex;
            vertical-align: middle;
        }

        .badge .left .title {
            font-size: 1em;
            font-weight: 700;
        }

        .badge .right {
            font-weight: 300;
        }

        .badge.discord .icon,
        .badge.discord .left {
            background-color: #4400AA;
        }

        .badge.youtube .icon,
        .badge.youtube .left {
            background-color: #AA0000;
        }

        .badge.readthedocs .icon,
        .badge.readthedocs .left {
            background-color: #297FB9;
        }

        .badge.catalog .icon,
        .badge.catalog .left {
            background-color: #8B00CC;
        }

        .badge.shop .icon,
        .badge.shop .left {
            background-color: #00AA55;
        }

        .badge-big {
            font-size: 1.5rem;
        }

        @media (max-width: 800px) {
            .title {
                font-size: 3em;
            }

            .sub {
                font-size: 2em;
            }

            .badges {
                width: 100%;
                padding: 0 2rem;
                flex-direction: column;
            }

            .badge {
                flex-direction: column;
                width: 100%;
            }

            .badge .left,
            .badge .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="content">
            <div class="soon">
                <div class="title">Лілка <span class="glow">v2</span></div>
                <div class="sub">Вже тут!</div>
            </div>

            <div class="badges">
                <a href="/shop" class="badge shop badge-big">
                    <div class="left">
                        <div class="icon">
                            <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <title>Магазин</title>

                        <div class="title">Магазин</div>

            </div>
            <div class="badges">
                <a href="https://catalog.lilka.dev/" class="badge catalog badge-big">
                    <div class="left">
                        <div class="icon">
                            <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <title>Каталог</title>

                            </svg>
                        </div>
                        <div class="title">Каталог</div>
                    </div>
                    <div class="right">Додатків</div>
                </a>
            </div>
            <div class="badges">
                <a href="https://discord.gg/ycmaz4vnbs" class="badge discord">
                    <div class="left">
                        <div class="icon">
                            <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <title>Discord</title>
                                <path fill="white"
                                    d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" />
                            </svg>
                        </div>
                        <div class="title">Discord</div>
                    </div>
                    <div class="right">Приєднуйтесь до дискусії</div>
                </a>

                <a href="https://youtu.be/6Tz70vqRrs0?si=fLhjktC660w-Vw-n" class="badge youtube">
                    <div class="left">
                        <div class="icon">
                            <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <title>YouTube</title>
                                <path fill="white"

                    <div class="right">Відео про проєкт</div>

                <a href="https://docs.lilka.dev" class="badge readthedocs">
                    <div class="left">
                        <div class="icon">
                            <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                        </div>
                        <div class="title">Документація</div>

                    <div class="right">Read The Docs</div>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
